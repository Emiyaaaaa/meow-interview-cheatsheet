name: Build desktop apps

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
    branches:
      - main

permissions:
  contents: write

jobs:
  detect:
    name: Detect version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.detect.outputs.version }}
      should_build: ${{ steps.detect.outputs.should_build }}
      should_release: ${{ steps.detect.outputs.should_release }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect version change
        id: detect
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "package.json version: $VERSION"

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            if [[ "$TAG_VERSION" != "$VERSION" ]]; then
              echo "Tag $GITHUB_REF_NAME does not match package.json version $VERSION"
              exit 1
            fi
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "Triggered by tag $GITHUB_REF_NAME"
            exit 0
          fi

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "Manual dispatch: build only"
            exit 0
          fi

          OLD_VERSION=""
          if git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            OLD_VERSION=$(git show HEAD^:package.json | node -e "let s='';process.stdin.on('data',d=>s+=d);process.stdin.on('end',()=>console.log(JSON.parse(s).version))")
          fi
          echo "Previous version: ${OLD_VERSION:-<none>}"

          if [[ "$OLD_VERSION" != "$VERSION" ]]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "Version changed ($OLD_VERSION -> $VERSION), will package, release, then tag"
          else
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "Version unchanged, skip build"
          fi

  build-macos:
    name: Build macOS (${{ matrix.arch }})
    needs: detect
    if: needs.detect.outputs.should_build == 'true'
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        arch:
          - x64
          - arm64

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build macOS package
        run: npm run package:mac -- --${{ matrix.arch }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload macOS package
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: dist/*.dmg
          if-no-files-found: error

  build-windows:
    name: Build Windows (x64)
    needs: detect
    if: needs.detect.outputs.should_build == 'true'
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows package
        run: npm run package:win -- --x64 --publish never

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: dist/*.exe
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: [detect, build-macos, build-windows]
    if: needs.detect.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.detect.outputs.version }}
        run: |
          set -euo pipefail
          CURRENT_TAG="v${VERSION}"
          PREV_TAG=$(gh release list --exclude-drafts --limit 50 --json tagName \
            --jq "[.[] | select(.tagName != \"${CURRENT_TAG}\")][0].tagName // empty")

          {
            echo "## What's Changed"
            echo
            if [[ -n "${PREV_TAG}" ]]; then
              git fetch origin "refs/tags/${PREV_TAG}:refs/tags/${PREV_TAG}" --force >/dev/null 2>&1 || true
              COMMITS=$(git log --pretty=format:'- %s (`%h`)' --no-merges "${PREV_TAG}..HEAD")
              if [[ -n "${COMMITS}" ]]; then
                echo "${COMMITS}"
              else
                echo "- No commits since ${PREV_TAG}"
              fi
              echo
              echo
              echo "**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${PREV_TAG}...${CURRENT_TAG}"
            else
              git log --pretty=format:'- %s (`%h`)' --no-merges
              echo
            fi
          } > release_notes.md

          echo "Generated notes from ${PREV_TAG:-<initial commit>} to ${CURRENT_TAG}"
          cat release_notes.md

      - name: Create tag and GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.detect.outputs.version }}
          name: v${{ needs.detect.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: artifacts/*
          body_path: release_notes.md
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
